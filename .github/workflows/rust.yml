name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (example: v0.1.0)"
        required: true
        type: string
      prerelease:
        description: "Mark release as prerelease"
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  build_release_binaries:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    strategy:
      matrix:
        include:
        - os: ubuntu-latest
          artifact_name: grm-linux-x86_64
          binary_path: target/release/grm
        - os: macos-latest
          artifact_name: grm-macos-x86_64
          binary_path: target/release/grm
        - os: windows-latest
          artifact_name: grm-windows-x86_64.exe
          binary_path: target/release/grm.exe
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Build release binary
      run: cargo build --release --verbose

    - name: Stage release artifact
      shell: bash
      run: |
        mkdir -p dist
        cp "${{ matrix.binary_path }}" "dist/${{ matrix.artifact_name }}"

    - name: Upload release artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.os }}
        path: dist/${{ matrix.artifact_name }}

  publish_release:
    if: github.event_name == 'workflow_dispatch'
    needs: build_release_binaries
    runs-on: ubuntu-latest

    steps:
    - name: Download release artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-artifacts
        pattern: release-*

    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.tag }}
        generate_release_notes: true
        prerelease: ${{ inputs.prerelease }}
        files: release-artifacts/**/*
