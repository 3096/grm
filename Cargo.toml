[package]
name = "grm"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
clap = { version = "4.6.0", features = ["derive"] }
directories = "6.0.0"
flate2 = "1.1.9"
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tar = "0.4.45"
tempfile = "3.27.0"
tokio = { version = "1.51.1", features = ["full"] }
toml = "1.1.2"
zip = "8.5.1"

[dev-dependencies]
tempfile = "3.27.0"
